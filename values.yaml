image: quay.io/poseidon/matchbox:v0.8.3
imagePullPolicy: IfNotPresent

service:
  serviceType: ClusterIP
  loadBalancerIP:
  http:
    port: 8080
  https:
    port: 8081
  loadBalancerSourceRanges: []

ingress:
  http:
    enabled: false
    path: /
    tls:
      enabled: false
    certificate:
      enabled: false
      annotations: {}
      issuerRef: {}
  https:
    enabled: false
    path: /
    tls:
      enabled: false
    certificate:
      enabled: false
      annotations: {}
      issuerRef: {}

certificate:
  enabled: false
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  dnsNames:
    - '{{ template "matchbox.fullname" . }}'
  issuerRef:
    name: '{{ template "matchbox.fullname" . }}'
    kind: Issuer

issuer:
  enabled: false

data:
  persistence:
    enabled: false
  volume:
    emptyDir: {}

assets:
  persistence:
    enabled: false
    annotations: {}
  volume:
    emptyDir: {}