{{- if .Values.certificate.enabled  }}
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  annotations:
  labels:
    app: "{{ template "matchbox.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  name: "{{ template "matchbox.fullname" . }}"
spec:
  # Secret names are always required.
  secretName: {{ template "matchbox.fullname" . }}-tls
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  organization: {{ .Values.certificate.organization }}
  isCA: false
  keySize: 2048
  keyAlgorithm: rsa
  keyEncoding: pkcs1
  usages:
    - server auth
  dnsNames:
    {{- tpl (toYaml .Values.certificate.dnsNames) . | nindent 4 }}
  uriSANs: {{ .Values.certificate.uriSANs }}
  ipAddresses:
    {{- toYaml .Values.certificate.ipAddresses | nindent 4 }}
  # Issuer references are always required.
  issuerRef:
    name: {{ tpl .Values.certificate.issuerRef.name . }}
    kind: {{ tpl .Values.certificate.issuerRef.kind . }}
{{- end }}