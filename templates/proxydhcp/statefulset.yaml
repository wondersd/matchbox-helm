{{- if .Values.proxydhcp.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "proxydhcp.fullname" . }}
  annotations:
    {{-  tpl (toYaml .Values.proxydhcp.annotations) . | nindent 4 }}
  labels:
    {{-  tpl (toYaml .Values.proxydhcp.labels) . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{-  tpl (toYaml .Values.proxydhcp.selectorLabels) . | nindent 6 }}
  template:
    metadata:
      labels:
        {{-  tpl (toYaml .Values.proxydhcp.labels) . | nindent 8 }}
    spec:
      hostNetwork: true
      containers:
        - image: {{ .Values.proxydhcp.image }}
          hostNetwork: true
          imagePullPolicy: {{ .Values.proxydhcp.imagePullPolicy }}
          name: dnsmasq
          args:
            - -d
            - -q
            - -p0
            - --dhcp-range=192.168.1.1,proxy,255.255.255.0
            - --enable-tftp
            - --tftp-root=/var/lib/tftpboot
            - --dhcp-userclass=set:ipxe,iPXE
            - --pxe-service=tag:#ipxe,x86PC,"PXE chainload to iPXE",undionly.kpxe
            - --pxe-service=tag:ipxe,x86PC,"iPXE",http://matchbox.internal.direct.evolutionchamber.org:8080/boot.ipxe
            - --pxe-service=tag:#ipxe,X86-64_EFI,"PXE chainload to iPXE UEFI",ipxe.efi
            - --pxe-service=tag:ipxe,X86-64_EFI,"iPXE UEFI",http://matchbox.internal.direct.evolutionchamber.org:8080/boot.ipxe
            - --log-queries
            - --log-dhcp
          ports:
            - name: tftp
              containerPort: {{ .Values.proxydhcp.tftpPort }}
            - name: dhcp
              containerPort: {{ .Values.proxydhcp.dhcpPort }}
              protocol: UDP
          resources:
            {{-  toYaml .Values.proxydhcp.resources | nindent 12 }}
          securityContext:
            capabilities:
              add:
              - NET_ADMIN
              - NET_RAW
            privileged: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  volumes: {}
{{- end }}